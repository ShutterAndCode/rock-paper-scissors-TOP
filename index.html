<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="titleBar">
        <h2>
            Welcome To RPS
        </h2>
    </div>
    <div class="choices" id="playerSelection">
        <button id="btn1" style="height: 100px; width: 300px;">Rock</button>
        <button id="btn2" style="height: 100px; width: 300px;">Paper</button>
        <button id="btn3" style="height: 100px; width: 300px;">Scissors</button>
    </div>
    <div class="lowerText">
    <div class="roundStart">
        <h3>Please make your choice and start the game</h3>
    </div>
    <div class="playGameDiv">
        <button id="playGame"style="height: 100px; width: 300px;">Play Game</button>
    </div>
    <Div class="results" id="results">
    </Div>
    <button id="reset" style="height: 50px; width: 300px;">RESET</button>
    </div>
    <script src="newScript.js"></script>
</body>
</html>
